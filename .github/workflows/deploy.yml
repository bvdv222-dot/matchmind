name: Deploy to Azure

# Provision (Bicep) and deploy (image built remotely in Azure Container Registry) with azd.
# Needs the repository variables that `azd pipeline config` sets: AZURE_CLIENT_ID, AZURE_TENANT_ID,
# AZURE_SUBSCRIPTION_ID, AZURE_ENV_NAME, AZURE_LOCATION (sign-in is OIDC federation: no secrets stored).
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: vars.AZURE_CLIENT_ID != ''
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
    steps:
      - uses: actions/checkout@v4
      - uses: Azure/setup-azd@v2
      - name: Sign in (federated credential)
        run: azd auth login --client-id "$AZURE_CLIENT_ID" --federated-credential-provider "github" --tenant-id "$AZURE_TENANT_ID"
      - name: Provision
        run: azd provision --no-prompt
      - name: Deploy
        run: azd deploy --no-prompt
      - name: Smoke test
        run: |
          url=$(azd env get-value SERVICE_APP_URI)
          for i in $(seq 1 30); do curl -sf "$url/api/health" && break; sleep 10; done
          curl -sf "$url/api/config"
          echo "### Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
