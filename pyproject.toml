[project]
name = "matchmind"
version = "0.1.0"
description = "Live, explainable match intelligence on synthetic football data"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.7",
    "jsonschema>=4.22",
]

[project.optional-dependencies]
# Added as each component lands: azure (Event Hubs, Cosmos, identity), agents (Agent Framework, Foundry), api (FastAPI)
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["generator*", "intel*", "mcp_server*", "agents*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
