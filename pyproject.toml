[project]
name = "matchmind"
version = "0.1.0"
description = "Live, explainable match intelligence on synthetic football data"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.7",
    "jsonschema>=4.22",
    "mcp==1.30.0",                     # Agent Framework 1.x requires mcp<2
    "agent-framework-core==1.22.0",
    "agent-framework-openai==1.17.0",   # OpenAI-compatible client: local Ollama now
    "agent-framework-foundry==1.15.0",  # Microsoft Foundry models and agents
    "azure-identity>=1.19",
]

[project.optional-dependencies]
# Added as each component lands: azure (Event Hubs, Cosmos, identity), agents (Agent Framework, Foundry), api (FastAPI)
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["contracts*", "generator*", "intel*", "mcp_server*", "agents*", "api*"]

[tool.setuptools.package-data]
intel = ["models/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["calibration"]   # one-off profiling scripts, kept as run
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["E741", "B905"]   # B905: zip over successive pairs is intentional
