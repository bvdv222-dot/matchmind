# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
# azd up: provisions infra/ (Bicep) and deploys the app image, built in Azure Container Registry (no local Docker).
name: matchmind
metadata:
  template: matchmind@0.1.0
services:
  app:
    project: .
    language: python
    host: containerapp
    docker:
      path: ./Dockerfile
      context: .
      remoteBuild: true
infra:
  provider: bicep
  path: infra
